  <circle cx="240" cy="160" r="7" fill="#378ADD" stroke="#0C447C" stroke-width="1" style="fill:rgb(55, 138, 221);stroke:rgb(12, 68, 124);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
